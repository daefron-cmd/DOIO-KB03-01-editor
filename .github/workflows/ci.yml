name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Lint Python
        run: uv run --frozen ruff check .

      - name: Check shell syntax
        run: bash -n scripts/build_app_bundle.sh firmware/build.sh

      - name: Verify firmware dumps
        run: cd firmware/dumps && shasum -a 256 -c SHA256SUMS

      - name: Run tests
        run: uv run --frozen pytest -q
